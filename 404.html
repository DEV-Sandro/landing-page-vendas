<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#0c2340">
  <title>Página não encontrada | Sandro Web</title>
  <link rel="icon" href="/landing-page-vendas/assets/images/favicon.ico" sizes="any">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px; background: #f6f8fb; color: #132238; font-family: Inter, system-ui, sans-serif; }
    main { width: min(640px, 100%); padding: clamp(32px, 8vw, 64px); border: 1px solid #dfe5ec; border-radius: 24px; background: #fff; box-shadow: 0 24px 70px rgba(12,35,64,.12); text-align: center; }
    span { color: #1f6feb; font-size: .78rem; font-weight: 800; letter-spacing: .12em; text-transform: uppercase; }
    h1 { margin: 14px 0 16px; color: #07182c; font-size: clamp(2rem, 8vw, 3.4rem); line-height: 1.08; letter-spacing: -.045em; }
    p { margin: 0 auto 28px; max-width: 460px; color: #5d6b7e; line-height: 1.7; }
    a { display: inline-flex; min-height: 50px; align-items: center; padding: 12px 20px; border-radius: 10px; background: #1f6feb; color: #fff; font-weight: 700; text-decoration: none; }
    a:hover { background: #155ac6; }
    a:focus-visible { outline: 3px solid #79b1ff; outline-offset: 4px; }
  </style>
</head>
<body>
  <main>
    <span>Erro 404</span>
    <h1>Esta página não foi encontrada.</h1>
    <p>O endereço pode ter mudado ou não existir. Volte para conhecer os serviços e projetos da Sandro Web.</p>
    <a href="/landing-page-vendas/">Voltar para a página inicial</a>
  </main>
</body>
</html>
